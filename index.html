<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FREEZA MODS - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: #0f0f1a;
            padding: 30px 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #e94560;
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo h1 { color: #e94560; font-size: 1.8rem; }
        .logo p { color: #888; font-size: 0.7rem; }
        h2 { text-align: center; color: #fff; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 25px; font-size: 0.8rem; }
        #chave {
            font-size: 28px;
            letter-spacing: 8px;
            text-align: center;
            font-family: monospace;
            padding: 12px;
            width: 100%;
            background: #1a1a2e;
            border: 2px solid #e94560;
            border-radius: 10px;
            color: #e94560;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }
        .error { color: #e94560; text-align: center; margin-top: 10px; font-size: 0.8rem; }
        .success { color: #00ff88; text-align: center; margin-top: 10px; font-size: 0.8rem; }
        .copyright { text-align: center; margin-top: 25px; color: #555; font-size: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><h1>FREEZA MODS</h1><p>® Todos os direitos reservados</p></div>
        <h2>🔐 Área Restrita</h2>
        <div class="subtitle">Digite sua chave de 6 dígitos</div>
        <input type="text" id="chave" maxlength="6" placeholder="000000" autocomplete="off">
        <button onclick="validarAcesso()">Verificar Acesso</button>
        <div id="message"></div>
        <div class="copyright">FREEZA MODS ® - Conteúdo protegido</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB7oO93Y0xexHjHmTvCarOiKkvJCV2c0qQ",
            authDomain: "do-painel-adm.firebaseapp.com",
            databaseURL: "https://do-painel-adm-default-rtdb.firebaseio.com",
            projectId: "do-painel-adm",
            storageBucket: "do-painel-adm.firebasestorage.app",
            messagingSenderId: "828287571381",
            appId: "1:828287571381:web:64f32bacf54cbaf65475fc"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.validarAcesso = async () => {
            const chave = document.getElementById('chave').value.trim();
            const msg = document.getElementById('message');
            if(!chave || chave.length !== 6) {
                msg.innerHTML = '<div class="error">❌ Digite uma chave válida!</div>';
                return;
            }
            
            const q = query(collection(db, 'chaves_acesso'), where('chave', '==', chave));
            const snapshot = await getDocs(q);
            
            if(snapshot.empty) {
                msg.innerHTML = '<div class="error">❌ Chave inválida!</div>';
                return;
            }
            
            const docRef = snapshot.docs[0];
            const data = docRef.data();
            
            if(data.banido) {
                msg.innerHTML = '<div class="error">🚫 Chave bloqueada!</div>';
                return;
            }
            
            await updateDoc(doc(db, 'chaves_acesso', docRef.id), {
                status: 'usado',
                dataUso: new Date()
            });
            
            sessionStorage.setItem('chave_acesso', chave);
            sessionStorage.setItem('chave_id', docRef.id);
            sessionStorage.setItem('nome_aluno', data.nome);
            sessionStorage.setItem('email_aluno', data.email);
            
            msg.innerHTML = '<div class="success">✅ Acesso liberado! Redirecionando...</div>';
            setTimeout(() => { window.location.href = 'curso.html'; }, 1500);
        };
        
        document.getElementById('chave').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
        });
    </script>
</body>
</html>

        /* Luzes Anti-Gravação */
        .light-border { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 25; }
        .light-edge { position: absolute; animation: lightPulse 0.3s infinite alternate; }

        .light-edge.left { left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, red, yellow, lime, cyan, magenta, red); animation: verticalShine 0.5s infinite linear; }
        .light-edge.right { right: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, magenta, cyan, lime, yellow, red, magenta); animation: verticalShineReverse 0.5s infinite linear; }
        .corner-flash { position: absolute; width: 40px; height: 40px; animation: cornerFlash 0.15s infinite alternate; }
        .corner-flash.tl { top: 0; left: 0; background: radial-gradient(circle, rgba(255,0,0,0.8), transparent); }
        .corner-flash.tr { top: 0; right: 0; background: radial-gradient(circle, rgba(0,255,0,0.8), transparent); }
        .corner-flash.bl { bottom: 0; left: 0; background: radial-gradient(circle, rgba(0,0,255,0.8), transparent); }
        .corner-flash.br { bottom: 0; right: 0; background: radial-gradient(circle, rgba(255,255,0,0.8), transparent); }
        .interference { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px); animation: interferenceShift 0.1s infinite linear; pointer-events: none; z-index: 26; }
        .scanline { position: absolute; top: 0; left: 0; right: 0; height: 100%; background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.05) 50%, transparent 50%); background-size: 100% 4px; animation: scanMove 0.05s infinite linear; pointer-events: none; z-index: 27; }
        .flicker { position: absolute; top: 0; left: 0; right: 0; bottom: 0; animation: screenFlicker 0.2s infinite; pointer-events: none; z-index: 28; }
        .copyright-bar { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; background: rgba(0,0,0,0.7); color: #e94560; padding: 4px; font-size: 9px; z-index: 30; }
        
        @keyframes lightPulse { 0% { opacity: 0.3; } 100% { opacity: 1; } }
        @keyframes horizontalShine { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }
        @keyframes horizontalShineReverse { 0% { background-position: 200% 0%; } 100% { background-position: 0% 0%; } }
        @keyframes verticalShine { 0% { background-position: 0% 0%; } 100% { background-position: 0% 200%; } }
        @keyframes verticalShineReverse { 0% { background-position: 0% 200%; } 100% { background-position: 0% 0%; } }
        @keyframes cornerFlash { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        @keyframes interferenceShift { 0% { background-position: 0 0; } 100% { background-position: 10px 10px; } }
        @keyframes scanMove { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }
        @keyframes screenFlicker { 0%,10%,30%,70%,100% { background: rgba(255,255,255,0); } 5% { background: rgba(255,255,255,0.05); } 20% { background: rgba(255,0,0,0.02); } 50% { background: rgba(0,255,0,0.02); } 85% { background: rgba(0,0,255,0.02); } }

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREEZA MODS - Painel ADM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            padding: 15px;
        }
        .container {
            max-width: 100%;
            background: #1a1a2e;
            border-radius: 15px;
            padding: 20px;
        }
        h1 { color: #e94560; font-size: 1.4rem; margin-bottom: 15px; }
        h2 { color: #fff; font-size: 1.1rem; margin: 15px 0 10px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #16213e;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 { font-size: 0.7rem; color: #aaa; }
        .stat-card .number { font-size: 1.5rem; color: #e94560; font-weight: bold; }
        button {
            background: #e94560;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin: 5px;
        }
        .btn-gerar { background: #4CAF50; }
        .btn-banir { background: #f44336; }
        .btn-editar { background: #2196F3; }
        .btn-excluir { background: #ff9800; }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #16213e;
            border: 1px solid #e94560;
            border-radius: 8px;
            color: white;
        }
        .tab {
            display: inline-block;
            padding: 8px 16px;
            background: #16213e;
            border-radius: 8px;
            margin-right: 8px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .tab.active { background: #e94560; }
        .content-tab { display: none; }
        .content-tab.active { display: block; }
        .modulo-card {
            background: #16213e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        .link-item {
            background: #0f0f1a;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .link-item input { flex: 1; margin: 0; }
        table { width: 100%; color: white; font-size: 0.7rem; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #333; }
        .status-ativo { color: #4CAF50; }
        .status-banido { color: #f44336; }
        .logout-btn { background: #dc3545; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <button class="logout-btn" onclick="sair()">Sair do Painel</button>
        <h1>🛡️ FREEZA MODS - Painel ADM</h1>
        
        <div>
            <div class="tab active" onclick="showTab('chaves')">🔑 Chaves</div>
            <div class="tab" onclick="showTab('conteudo')">📚 Conteúdo</div>
            <div class="tab" onclick="showTab('banidos')">🚫 Banidos</div>
        </div>
        
        <div id="chaves" class="content-tab active">
            <div class="stats" id="stats"></div>
            <button class="btn-gerar" onclick="abrirModalChave()">➕ Gerar Chave</button>
            <input type="text" id="search" placeholder="Buscar..." style="margin: 10px 0;">
            <div id="listaChaves"></div>
        </div>
        
        <div id="conteudo" class="content-tab">
            <button class="btn-gerar" onclick="abrirModalModulo()">➕ Adicionar Módulo</button>
            <div id="listaModulos"></div>
        </div>
        
        <div id="banidos" class="content-tab">
            <div id="listaBanidos"></div>
        </div>
    </div>
    
    <div id="modalChave" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000;">
        <div style="background:#1a1a2e; padding:20px; border-radius:15px; width:90%;">
            <h3>🔑 Nova Chave</h3>
            <input type="text" id="nomeAluno" placeholder="Nome completo">
            <input type="email" id="emailAluno" placeholder="Email">
            <button onclick="gerarChave()">Gerar</button>
            <button onclick="fecharModal('modalChave')">Cancelar</button>
        </div>
    </div>
    
    <div id="modalModulo" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000; overflow-y:auto;">
        <div style="background:#1a1a2e; padding:20px; border-radius:15px; width:90%; max-height:80%; overflow-y:auto;">
            <h3 id="modalTitle">📚 Adicionar Módulo</h3>
            <input type="hidden" id="moduloId">
            <input type="text" id="moduloTitulo" placeholder="Título">
            <textarea id="moduloDescricao" placeholder="Descrição completa" rows="3"></textarea>
            <input type="text" id="moduloDescricaoCurta" placeholder="Descrição curta">
            <input type="text" id="moduloVideoUrl" placeholder="URL do YouTube">
            <input type="number" id="moduloOrdem" placeholder="Ordem">
            <h4>📎 Links para Download</h4>
            <div id="linksContainer"></div>
            <button onclick="adicionarLink()" style="background:#00bcd4;">➕ Adicionar Link</button>
            <button onclick="salvarModulo()" style="background:#4CAF50;">💾 Salvar</button>
            <button onclick="fecharModal('modalModulo')">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, updateDoc, addDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyB7oO93Y0xexHjHmTvCarOiKkvJCV2c0qQ",
            authDomain: "do-painel-adm.firebaseapp.com",
            databaseURL: "https://do-painel-adm-default-rtdb.firebaseio.com",
            projectId: "do-painel-adm",
            storageBucket: "do-painel-adm.firebasestorage.app",
            messagingSenderId: "828287571381",
            appId: "1:828287571381:web:64f32bacf54cbaf65475fc"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let chavesData = [];
        
        function gerarChaveUnica() { return Math.floor(100000 + Math.random() * 900000).toString(); }
        
        async function isChaveUnica(chave) {
            const snapshot = await getDocs(query(collection(db, 'chaves_acesso'), where('chave', '==', chave)));
            return snapshot.empty;
        }
        
        window.abrirModalChave = () => { document.getElementById('modalChave').style.display = 'flex'; };
        window.fecharModal = (id) => { document.getElementById(id).style.display = 'none'; };
        
        window.gerarChave = async () => {
            const nome = document.getElementById('nomeAluno').value;
            const email = document.getElementById('emailAluno').value;
            if(!nome || !email) { alert('Preencha tudo!'); return; }
            
            let chave = await (async () => { let c; while(!(await isChaveUnica(c = gerarChaveUnica()))); return c; })();
            await addDoc(collection(db, 'chaves_acesso'), { chave, nome, email, status: 'ativo', banido: false, createdAt: new Date() });
            alert(`Chave: ${chave}\nEnvie para o aluno!`);
            fecharModal('modalChave');
            carregarChaves();
        };
        
        window.carregarChaves = async () => {
            const snapshot = await getDocs(query(collection(db, 'chaves_acesso'), orderBy('createdAt', 'desc')));
            chavesData = [];
            let stats = { ativo: 0, usado: 0, banido: 0 };
            snapshot.forEach(doc => {
                const c = { id: doc.id, ...doc.data() };
                if(c.banido) stats.banido++;
                else if(c.status === 'ativo') stats.ativo++;
                else stats.usado++;
                chavesData.push(c);
            });
            document.getElementById('stats').innerHTML = `
                <div class="stat-card"><h3>Ativas</h3><div class="number">${stats.ativo}</div></div>
                <div class="stat-card"><h3>Usadas</h3><div class="number">${stats.usado}</div></div>
                <div class="stat-card"><h3>Banidas</h3><div class="number">${stats.banido}</div></div>
            `;
            filtrarChaves();
        };
        
        window.filtrarChaves = () => {
            const search = document.getElementById('search').value.toLowerCase();
            const filtradas = chavesData.filter(c => c.chave.includes(search) || c.nome.toLowerCase().includes(search));
            document.getElementById('listaChaves').innerHTML = `
                <table><thead><tr><th>Chave</th><th>Nome</th><th>Status</th><th>Ações</th></tr></thead><tbody>
                ${filtradas.map(c => `
                    <tr><td>${c.chave}</td><td>${c.nome}</td>
                    <td class="${c.banido ? 'status-banido' : 'status-ativo'}">${c.banido ? '🚫 Banido' : c.status}</td>
                    <td>${!c.banido ? `<button class="btn-banir" onclick="banirChave('${c.id}','${c.nome}')">Banir</button>` : `<button onclick="desbanirChave('${c.id}')">Desbanir</button>`}
                    <button class="btn-excluir" onclick="excluirChave('${c.id}')">Excluir</button></td></tr>
                `).join('')}</tbody></table>
            `;
        };
        
        window.banirChave = async (id, nome) => { if(confirm(`Banir ${nome}?`)) { await updateDoc(doc(db, 'chaves_acesso', id), { banido: true, status: 'banido' }); carregarChaves(); carregarBanidos(); } };
        window.desbanirChave = async (id) => { await updateDoc(doc(db, 'chaves_acesso', id), { banido: false, status: 'ativo' }); carregarChaves(); carregarBanidos(); };
        window.excluirChave = async (id) => { if(confirm('Excluir?')) { await deleteDoc(doc(db, 'chaves_acesso', id)); carregarChaves(); } };
        
        let linksCount = 0;
        window.adicionarLink = () => {
            const div = document.createElement('div');
            div.className = 'link-item';
            div.innerHTML = `<input type="text" placeholder="Título (ex: Baixar APK)" style="flex:1"><input type="text" placeholder="URL do link" style="flex:2"><button onclick="this.parentElement.remove()">❌</button>`;
            document.getElementById('linksContainer').appendChild(div);
        };
        
        function coletarLinks() {
            let links = [];
            document.querySelectorAll('#linksContainer .link-item').forEach(item => {
                let inputs = item.querySelectorAll('input');
                if(inputs[0].value && inputs[1].value) links.push({ titulo: inputs[0].value, url: inputs[1].value });
            });
            return links;
        }
        
        window.abrirModalModulo = (modulo = null) => {
            document.getElementById('moduloId').value = modulo?.id || '';
            document.getElementById('moduloTitulo').value = modulo?.titulo || '';
            document.getElementById('moduloDescricao').value = modulo?.descricao || '';
            document.getElementById('moduloDescricaoCurta').value = modulo?.descricaoCurta || '';
            document.getElementById('moduloVideoUrl').value = modulo?.videoUrl || '';
            document.getElementById('moduloOrdem').value = modulo?.ordem || '';
            document.getElementById('linksContainer').innerHTML = '';
            if(modulo?.links) modulo.links.forEach(l => { adicionarLink(); let items = document.querySelectorAll('#linksContainer .link-item'); let last = items[items.length-1]; if(last) { last.querySelectorAll('input')[0].value = l.titulo; last.querySelectorAll('input')[1].value = l.url; } });
            document.getElementById('modalModulo').style.display = 'flex';
        };
        
        window.salvarModulo = async () => {
            const id = document.getElementById('moduloId').value;
            const dados = {
                titulo: document.getElementById('moduloTitulo').value,
                descricao: document.getElementById('moduloDescricao').value,
                descricaoCurta: document.getElementById('moduloDescricaoCurta').value,
                videoUrl: document.getElementById('moduloVideoUrl').value,
                ordem: parseInt(document.getElementById('moduloOrdem').value),
                links: coletarLinks()
            };
            if(!dados.titulo || !dados.videoUrl) { alert('Preencha título e URL do vídeo!'); return; }
            if(id) await updateDoc(doc(db, 'conteudo', id), dados);
            else await addDoc(collection(db, 'conteudo'), { ...dados, createdAt: new Date() });
            fecharModal('modalModulo');
            carregarModulos();
        };
        
        window.carregarModulos = async () => {
            const snapshot = await getDocs(query(collection(db, 'conteudo'), orderBy('ordem')));
            let html = '';
            snapshot.forEach(doc => {
                const m = { id: doc.id, ...doc.data() };
                html += `<div class="modulo-card"><h4>📖 ${m.titulo}</h4><p>Ordem: ${m.ordem}</p><button class="btn-editar" onclick='abrirModalModulo(${JSON.stringify(m)})'>Editar</button><button class="btn-excluir" onclick="excluirModulo('${m.id}')">Excluir</button></div>`;
            });
            document.getElementById('listaModulos').innerHTML = html || '<p>Nenhum módulo</p>';
        };
        
        window.excluirModulo = async (id) => { if(confirm('Excluir?')) { await deleteDoc(doc(db, 'conteudo', id)); carregarModulos(); } };
        
        window.carregarBanidos = async () => {
            const snapshot = await getDocs(query(collection(db, 'chaves_acesso'), where('banido', '==', true)));
            let html = '<table><thead><tr><th>Nome</th><th>Email</th><th>Chave</th><th>Ações</th></tr></thead><tbody>';
            snapshot.forEach(doc => {
                const c = doc.data();
                html += `<tr><td>${c.nome}</td><td>${c.email}</td><td>${c.chave}</td><td><button onclick="desbanirChave('${doc.id}')">Desbanir</button></td></tr>`;
            });
            html += '</tbody></table>';
            document.getElementById('listaBanidos').innerHTML = html || '<p>Nenhum banido</p>';
        };
        
        window.showTab = (tabId) => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'banidos') carregarBanidos();
        };
        
        window.sair = async () => { await signOut(auth); window.location.href = 'index.html'; };
        
        onAuthStateChanged(auth, (user) => { if(!user) window.location.href = 'index.html'; else { carregarChaves(); carregarModulos(); } });
    </script>
</body>
</html>
